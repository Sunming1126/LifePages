<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聆听回忆 · 拾光册</title><link rel="stylesheet" href="/static/style.css"></head><body><header><a class="brand" href="/">拾光册 <span>LifePages</span></a></header><section class="workspace"><span class="eyebrow">LISTEN TO THE STORY</span><h2 id="title">聆听这段回忆</h2><p>每一段声音，都是独一无二的珍藏。</p><div id="list"></div></section><script>fetch('/api/stories/'+location.pathname.split('/').pop()).then(r=>r.json()).then(s=>{document.getElementById('title').textContent=s.title;const list=document.getElementById('list');s.recordings.forEach((r,i)=>{let div=document.createElement('div');div.className='card';let a=document.createElement('audio');a.addEventListener('ended',()=>{let all=list.querySelectorAll('audio');if(all[i+1])all[i+1].play()});a.controls=true;a.src='/api/recordings/'+r.id+'/audio';div.append('第 '+(i+1)+' 段录音',a);list.append(div)});if(!s.recordings.length)list.textContent='暂无录音';}).catch(()=>document.getElementById('list').textContent='无法加载故事');</script></body></html>
