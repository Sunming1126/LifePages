org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# Let the app's ARM64 filter take precedence over Flutter's universal ABI list.
disable-abi-filtering=true
# RTC's bundled audio dependencies still reference the legacy support libraries.
android.enableJetifier=true
# Preserve AGP 8 manifest behavior for the RTC SDK's older vector libraries.
# https://developer.android.com/build/releases/agp-9-0-0-release-notes
android.uniquePackageNames=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
