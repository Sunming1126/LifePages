<h2>麦克风</h2>
<p>按住聊天或创作页的语音按钮时才会录音。开启 AI 转写需要您先同意语音交由阿里云百炼处理。您可以改用文字输入。</p>
<h2>相册</h2>
<p>插入图片或更换头像时，LifePages 打开 iOS 系统照片选择器，读取您选中的照片。选择照片之后，图片可随书稿或头像保存到 LifePages。</p>
<h2>相机</h2>
<p>语音播报组件包含相机接口。当前版本通过相册插图、通过麦克风录音，播报使用实时音频，日常功能无需相机。</p>
<h2>修改权限</h2>
<p>可在 iOS「设置 → App → LifePages」查看系统权限。第三方 AI 授权可在 LifePages「我的 → 设置 → AI 数据授权」管理。<a href="privacy">查看信息处理详情</a>。</p>
