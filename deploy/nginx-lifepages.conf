# LifePages isolated request limits, used only by its locations.
limit_req_zone $binary_remote_addr zone=lifepages_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=lifepages_chat:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=lifepages_rtc:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=lifepages_bootstrap:10m rate=1r/m;
