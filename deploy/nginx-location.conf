    # LifePages begin
    location = /lifepages { return 308 /lifepages/; }
    location = /lifepages/api/bootstrap {
        limit_req zone=lifepages_bootstrap burst=3 nodelay;
        limit_req_status 429;
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8041/api/bootstrap;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }
    location ^~ /lifepages/ {
        location ~ "^/lifepages/api/people/[0-9a-f]{32}/turns(/stream)?$" {
            limit_req zone=lifepages_chat burst=160 nodelay;
            limit_req_status 429;
            access_log off;
            error_log /dev/null crit;
            client_max_body_size 9m;
            rewrite ^/lifepages(/.*)$ $1 break;
            proxy_pass http://127.0.0.1:8041;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
        limit_req zone=lifepages_api burst=30 nodelay;
        limit_req_status 429;
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 9m;
        proxy_pass http://127.0.0.1:8041/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    # LifePages end
